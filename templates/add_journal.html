{% extends "base.html" %}{% set title="Add Journal" %}{% set page_title="Add Journal" %}{% block content %}<div class="modern-page"><div class="panel form-panel"><h2>📰 Add Journal</h2><p style="color:#6b778a;font-size:12px">Add academic, technical or national journal information.</p>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="POST" enctype="multipart/form-data"><div class="form-grid">
<div class="field"><label>Journal Name *</label><input name="title" required></div><div class="field"><label>Publisher</label><input name="publisher"></div><div class="field"><label>Category</label><input name="category" placeholder="Technical, National, Research..."></div><div class="field"><label>Volume</label><input name="volume"></div><div class="field"><label>Issue</label><input name="issue"></div><div class="field"><label>Publication Year</label><input name="publication_year"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Cover Image</label><input type="file" name="cover_image" accept="image/*"></div><div class="field"><label>PDF File</label><input type="file" name="pdf_file" accept="application/pdf"></div></div><div class="form-actions"><button class="btn">Save Journal</button><a class="btn secondary" href="/admin/journals">Cancel</a></div></form></div></div>{% endblock %}
