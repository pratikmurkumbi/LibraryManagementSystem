<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="login-modern"><div class="login-card auth-card"><div class="login-brand"><div class="logo"><img src="{{ url_for('static',filename='images/college-logo-placeholder.svg') }}" alt="College logo"></div><div class="login-college">Government Polytechnic Haliyal</div><h1>Forgot Password</h1><p>Library Management System</p></div>
{% if error %}<div class="alert">{{error}}</div>{% endif %}{% if message %}<div class="success">{{message}}</div>{% endif %}
<form method="POST"><label>Username, Email or Phone</label><input name="identity" placeholder="Enter account details" required><button type="submit">Generate OTP →</button></form>
<div class="login-links">{% if message %}<a href="/forgot-password/verify">Enter OTP</a><span>•</span>{% endif %}<a href="/login">← Back to Login</a></div></div></body></html>
