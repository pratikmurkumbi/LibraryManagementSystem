{% extends "base.html" %}{% set title="Add E-Book" %}{% set page_title="Add E-Book" %}{% block content %}<div class="modern-page"><div class="panel form-panel"><h2>📱 Add E-Book</h2><p style="color:#6b778a;font-size:12px">Only upload PDFs that your college is permitted to distribute.</p>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="POST" enctype="multipart/form-data"><div class="form-grid">
<div class="field"><label>Title *</label><input name="title" required></div><div class="field"><label>Author</label><input name="author"></div><div class="field"><label>Category</label><input name="category" placeholder="Computer Science, Science..."></div><div class="field"><label>ISBN</label><input name="isbn"></div><div class="field"><label>Publisher</label><input name="publisher"></div><div class="field"><label>Publication Year</label><input name="publication_year"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Cover Image</label><input type="file" name="cover_image" accept="image/*"></div><div class="field"><label>PDF File *</label><input type="file" name="pdf_file" accept="application/pdf" required></div></div><div class="form-actions"><button class="btn">Upload E-Book</button><a class="btn secondary" href="/admin/ebooks">Cancel</a></div></form></div></div>{% endblock %}
