<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify OTP</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="login-modern"><div class="login-card auth-card"><div class="login-brand"><div class="logo"><img src="{{ url_for('static',filename='images/college-logo-placeholder.svg') }}" alt="College logo"></div><div class="login-college">Government Polytechnic Haliyal</div><h1>Verify OTP</h1><p>Library Management System</p></div>
{% if error %}<div class="alert">{{error}}</div>{% endif %}{% if success %}<div class="success">{{success}}</div><div class="login-links"><a href="/login">Go to Login →</a></div>{% else %}
<form method="POST"><label>OTP</label><input name="otp" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit OTP" required><label>New Password</label><input type="password" name="new_password" minlength="6" required><button type="submit">Change Password →</button></form><div class="login-links"><a href="/forgot-password">← Back</a></div>{% endif %}</div></body></html>
