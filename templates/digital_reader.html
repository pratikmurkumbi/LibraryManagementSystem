{% extends "base.html" %}{% set title=resource_type+' Reader' %}{% set page_title=resource.title %}
{% block content %}<div class="modern-page"><div class="section-head"><div><span class="lp-badge">{{resource_type}}</span><h2 style="margin-top:8px">{{resource.title}}</h2><p>{{resource.author or resource.publisher or ''}}</p></div><button class="btn" onclick="window.print()">🖨️ Print</button></div><div class="panel" style="padding:8px"><iframe src="{{file_url}}" title="{{resource.title}}" style="width:100%;height:75vh;border:0;border-radius:14px;background:#f7f7f7"></iframe><div style="padding:12px"><a class="btn" href="{{file_url}}" target="_blank">Open PDF in new tab</a></div></div></div>{% endblock %}
